name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify pinned dependencies
        uses: miragon/pin-npm-dependencies@v1

      - run: npm ci
      - run: npm test
      - run: npm run build
