name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - uses: miragon/pin-npm-dependencies@7bd516fed2bbbfdd395772661f8e8cf8731bacae # v1.1.0
        with:
          files: package.json

      - run: npm ci
      - run: npm test
      - run: npm run build
